/*
 * A note about publishing and signing.
 * Maven central requires that artifacts be signed. And upload is done via Maven Central Portal.
 * To publish you will need these environment variables defined:
 *       MAVEN_CENTRAL_PORTAL_TOKEN_USERNAME
 *       MAVEN_CENTRAL_PORTAL_TOKEN_PASSWORD
 *       MAVEN_GPG_PRIVATE_KEY
 *       MAVEN_GPG_PASSPHRASE
 * If run manually, the suggestion is to put these in a shell script with restricted read permissions,
 * then source it before calling ./gradlew
 * If run from a Github action, make sure these environment variables are defined.
 */
plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'test-report-aggregation'
    id "io.freefair.aggregate-javadoc-legacy" version "9.5.0"
    id "pl.allegro.tech.build.axion-release" version "1.21.3"
    alias(libs.plugins.spotless)
}

scmVersion {
    // By default, axion-release suffixes the version with the current branch name for any
    // branch other than the release branch (e.g. "0.1.0-transittrack-SNAPSHOT"). Since
    // 'transittrack' is a long-lived integration branch (published the same way as
    // master, see publish_snapshots.yml), give it a plain, unsuffixed version too.
    branchVersionCreator = ['transittrack': 'simple']
}

// Setup and configure properties that are consistent across all projects, including sub-modules.
allprojects {
    group 'eu.transittrack.gtfs-validator'

    // Per the axion-release plugin, this computes the project version based
    // on the most recent tag in the repo.
    version scmVersion.version

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        // All Java projects should target the same compatibility version.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        // Our source files should be encoded in UTF-8, regardless of the platform (e.g. Windows).
        options.encoding = "UTF-8"
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    // All projects that include the 'java` plugin will have a Test task by default.
    tasks.withType(Test).configureEach {
        // Always run tests, even when nothing changed.
        dependsOn 'cleanTest'

        // Show test results.
        testLogging {
            events "passed", "skipped", "failed"
        }

        // Define a system project for the project version
        systemProperty 'gtfsValidatorVersionForTest', project.version
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: libs.plugins.spotless.get().pluginId

    // Any project with a test should be added to test report aggregation in the root
    // project. This must happen eagerly during configuration (the 'java' plugin above
    // has already created the 'test' task), rather than lazily inside a Test task's
    // configureEach action: by the time that action would fire, the root project's
    // 'testReportAggregation' configuration may already have been resolved (e.g. while
    // resolving another project's contribution), and Gradle forbids mutating a
    // configuration's dependencies after it has been resolved.
    rootProject.dependencies.add('testReportAggregation', project)

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set('javadoc')
        from javadoc
    }

    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }

    spotless {
        java {
            googleJavaFormat("1.30.0")
            target("src/**/*.java")
        }
    }

    // These modules require the same publishing configuration, apart from the name of the module
    // Also we want to limit artefact publishing to these modules.
    if (project.name == 'main'
            || project.name == 'core'
            || project.name == 'model'
         ) {
        def fullProjectName = 'gtfs-validator-' + project.name

        afterEvaluate {
            publishing {
                repositories {
//                    maven {
//                        // Snapshot uses a different repository than release.
//                        // The publish in that case will upload to Maven Central snapshot repository.
//                        if (version.endsWith('SNAPSHOT')) {
//                            url = 'https://central.sonatype.com/repository/maven-snapshots/'
//                            credentials {
//                                username = System.getenv("MAVEN_CENTRAL_PORTAL_TOKEN_USERNAME")
//                                password = System.getenv("MAVEN_CENTRAL_PORTAL_TOKEN_PASSWORD")
//                            }
//                        } else {
//                            // For releases, the publish task does not upload to MavenCentral.
//                            // It just creates the artifacts directory hierarchy on the local disk,
//                            // The actual zipping and uploading is done in the publishToMavenCentral task.
//                            url = "${buildDir}/local-repo"
//                        }
//                    }
                    maven {
                        // GitHub Packages' Maven registry, published alongside Maven Central.
                        // Unlike Central it accepts both snapshot and release versions through
                        // the same URL, so this repository is not conditional on the version.
                        name = 'GitHubPackages'
                        url = 'https://maven.pkg.github.com/transittrack/gtfs-validator'
                        credentials {
                            username = System.getenv('GITHUB_ACTOR')
                            password = System.getenv('GITHUB_TOKEN')
                        }
                    }
                }

                publications {
                    mavenJava(MavenPublication) {
                        from components.java
                        artifactId = fullProjectName

                        artifact sourcesJar
                        artifact javadocJar

                        // Definition of the pom that will be included with the uploaded artifacts.
                        pom {
                            name = fullProjectName
                            description = 'The ' + project.name + " artifacts from the gtfs validator"
                            url = 'https://github.com/transittrack/gtfs-validator'
                            licenses {
                                license {
                                    name = 'The Apache License, Version 2.0'
                                    url = 'https://github.com/transittrack/gtfs-validator/blob/transittrack/LICENSE'
                                }
                            }
                            developers {
                                developer {
                                    id = 'dev'
                                    name = 'Dev group'
                                    email = 'it@mobilitydata.org'
                                }
                            }
                            scm {
                                connection = 'scm:git:git://github.com/transittrack/gtfs-validator.git'
                                developerConnection = 'scm:git:ssh://github.com/transittrack/gtfs-validator.git'
                                url = 'https://github.com/transittrack/gtfs-validator'
                            }
                        }
                    }
                }
            }
//            signing {
//                useInMemoryPgpKeys(System.getenv('MAVEN_GPG_PRIVATE_KEY'), System.getenv('MAVEN_GPG_PASSPHRASE'))
//                sign publishing.publications.mavenJava
//            }


            tasks.register('publishToMavenCentral') {
                // We want to do call the publish task only if the version is a release (ie not a snapshot).
                // Without this conditional, with a snapshot it would do the publish first, then throw the Exception below.
                // But since the dependsOn is within the conditional, the dependency is not created for snapshot versions
                // so the publish in that case is never executed.
                if (!version.toString().endsWith('SNAPSHOT')) {
                    dependsOn tasks.publish
                }
                doFirst {
                    if (version.toString().endsWith('SNAPSHOT')) {
                        throw new GradleException("Version \"" + version +
                                "\" is a snapshot. Cannot publish to Maven Central")
                    }
                }

                doLast {
                    exec {
                        workingDir project.projectDir
                        commandLine 'bash', "${project.rootDir}/scripts/publish_to_maven_central.sh", project.name, project.version
                    }
                }
            }

            tasks.register('publishToSnapshotRepository') {
                // We want to call the publish task only if the version is a snapshot.
                // Without this conditional, with a release it would do the publish first, then throw the Exception below.
                // But since the dependsOn is within the conditional, the dependency is not created for release versions
                // so the publish in that case is never executed.
                if (version.toString().endsWith('SNAPSHOT')) {
                    dependsOn tasks.publish
                }
                doFirst {
                    if (!version.toString().endsWith('SNAPSHOT')) {
                        throw new GradleException("Version \"" + version +
                                "\" is a NOT a snapshot. Cannot publish to the snapshot repository")
                    }
                }
            }
        }


    }

    compileJava {
        options.compilerArgs << '-parameters'
    }

    compileTestJava {
        options.compilerArgs << '-parameters'
    }

}

reporting {
    reports {
        // Necessary for unit test result aggregation.
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = "test"
        }
    }
}

tasks.register('copyRulesToWebClient', Copy) {
    from "./RULES.md"
    into "./web/client/static"
}

build.dependsOn copyRulesToWebClient
